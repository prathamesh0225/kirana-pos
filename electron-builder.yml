appId: com.kirana.pos
productName: Kirana Mart POS

copyright: Copyright © 2026 Kirana Mart

directories:
  buildResources: resources

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml}'
  - '!{dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!tests/**'

asarUnpack:
  - resources/**

win:
  executableName: kirana-pos
  target:
    - nsis

nsis:
  artifactName: Kirana-Mart-POS-${version}-Setup.${ext}
  shortcutName: Kirana Mart POS
  uninstallDisplayName: Kirana Mart POS
  createDesktopShortcut: always
  createStartMenuShortcut: true